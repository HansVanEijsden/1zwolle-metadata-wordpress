services:
  1zwolle-metadata-wordpress:
    build: .
    container_name: 1zwolle-metadata-wordpress
    environment:
      - SOURCE_URL=https://1zwolle.nl/wp-json/metadata/v1/current
      - FETCH_INTERVAL=60s
      - JITTER=10s
      - PORT=8080
      - LOG_LEVEL=info
      # Cover-art resolver (replaces cloud.hansvaneijsden.nl cover-art-1zwolle.php)
      # COVERART_SPECIAL_TRIGGER/URL intentionally not set: 1Zwolle's special-song
      # plugin is not active yet. Set them (e.g. "1Zwolleschijf - ") when it goes live.
      - COVERART_ENABLED=true
      - COVERART_HUB_URL=http://172.21.0.38:9000
      - COVERART_HUB_INPUT=radio-cover-art
      - COVERART_HUB_SECRET=bestwelgeheim
      - COVERART_FALLBACK_IMAGE=https://1zwolle.nl/wp-content/uploads/sites/1/2025/10/Non-Stop-1024x1024.jpg
    networks:
      metanet:
        ipv4_address: 172.21.0.92
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  metanet:
    external: true
    name: metanet
